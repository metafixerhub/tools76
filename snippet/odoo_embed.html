<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <style>
:root {
    --primary: #4F46E5;
    --primary-hover: #4338CA;
    --bg-color: #f3f4f6;
    --text-color: #1f2937;
    --text-muted: #6b7280;
    --glass-bg: rgba(255, 255, 255, 0.85);
    --glass-border: rgba(255, 255, 255, 0.4);
    --glass-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    --error: #ef4444;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start; /* Changed from center to fix scrolling */
    color: var(--text-color);
    padding: 2rem;
}

.form-wrapper {
    width: 100%;
    max-width: 600px;
    position: relative;
}

.glass-form {
    background: var(--glass-bg);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 2.5rem;
    box-shadow: var(--glass-shadow);
    position: relative;
    overflow: hidden;
}

.form-title {
    font-size: 1.75rem;
    font-weight: 700;
    margin-bottom: 2rem;
    text-align: center;
    color: var(--primary);
}

.form-group {
    margin-bottom: 1.5rem;
}

.form-row {
    display: flex;
    gap: 1.5rem;
}

.form-row .form-group {
    flex: 1;
}

label {
    display: block;
    font-size: 0.875rem;
    font-weight: 500;
    margin-bottom: 0.5rem;
    color: var(--text-color);
}

input[type="text"],
input[type="email"],
input[type="tel"],
select {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1px solid #d1d5db;
    border-radius: 10px;
    font-size: 1rem;
    font-family: 'Inter', sans-serif;
    background: white;
    transition: all 0.2s ease;
    outline: none;
}

input:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
}

.checkbox-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
    margin-top: 0.5rem;
}

.checkbox-group label, .consent-group label {
    display: flex;
    align-items: center;
    font-weight: 400;
    font-size: 0.875rem;
    cursor: pointer;
}

input[type="checkbox"] {
    margin-right: 0.5rem;
    width: 1rem;
    height: 1rem;
    accent-color: var(--primary);
}

.consent-group {
    margin-top: 2rem;
    background: rgba(79, 70, 229, 0.05);
    padding: 1rem;
    border-radius: 10px;
    border: 1px solid rgba(79, 70, 229, 0.1);
}

.submit-btn {
    width: 100%;
    padding: 1rem;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    margin-top: 1rem;
}

.submit-btn:hover {
    background: var(--primary-hover);
}

.submit-btn:active {
    transform: translateY(2px);
}

.submit-btn:disabled {
    background: #9ca3af;
    cursor: not-allowed;
}

/* Loading Overlay */
.loading-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(255, 255, 255, 0.9);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 10;
    border-radius: 20px;
    text-align: center;
}

.loading-overlay p {
    margin-top: 1rem;
    font-weight: 500;
    color: var(--primary);
    line-height: 1.5;
}

.progress-container { width: 80%; height: 8px; background: rgba(79, 70, 229, 0.2); border-radius: 4px; overflow: hidden; margin-bottom: 1rem; } .progress-bar { width: 0%; height: 100%; background: var(--primary); animation: progress 2s ease-in-out infinite; } @keyframes progress { 0% { width: 0%; transform: translateX(-100%); } 50% { width: 50%; transform: translateX(50%); } 100% { width: 100%; transform: translateX(200%); } }

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.hidden {
    display: none !important;
}

.error-message {
    margin-top: 1rem;
    padding: 0.75rem;
    background: #fef2f2;
    border: 1px solid #f87171;
    color: var(--error);
    border-radius: 8px;
    font-size: 0.875rem;
    text-align: center;
}

@media (max-width: 640px) {
    .form-row {
        flex-direction: column;
        gap: 0;
    }
    
    .checkbox-group {
        grid-template-columns: 1fr;
    }
    
    .glass-form {
        padding: 1.5rem;
    }
}


</style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="form-wrapper">
    <form id="registrationForm" class="glass-form">
        <h2 class="form-title">Join Our Community</h2>
        
        <div class="form-group">
            <label for="fullName">Full Name *</label>
            <input type="text" id="fullName" name="fullName" required placeholder="John Doe">
        </div>
        
        <div class="form-group">
            <label for="email">Email Address *</label>
            <input type="email" id="email" name="email" required placeholder="john@example.com">
        </div>
        
        <div class="form-group">
            <label for="phone">Phone Number *</label>
            <input type="tel" id="phone" name="phone" required placeholder="+91 XXXXXXXXXX">
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="address">Address *</label>
                <input type="text" id="address" name="address" required placeholder="123 Main St">
            </div>
            <div class="form-group">
                <label for="city">City *</label>
                <input type="text" id="city" name="city" required placeholder="Bangalore">
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label for="state">State *</label>
                <input type="text" id="state" name="state" required placeholder="Karnataka">
            </div>
            <div class="form-group">
                <label for="pinZip">PIN/ZIP *</label>
                <input type="text" id="pinZip" name="pinZip" required placeholder="560001">
            </div>
        </div>
        
        <div class="form-group">
            <label>Interests (Select multiple) *</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="interests" value="Software"> Software</label>
                <label><input type="checkbox" name="interests" value="Robotics"> Robotics</label>
                <label><input type="checkbox" name="interests" value="AI"> AI</label>
                <label><input type="checkbox" name="interests" value="Hardware"> Hardware</label>
                <label><input type="checkbox" name="interests" value="Data Science"> Data Science</label>
                <label><input type="checkbox" name="interests" value="Other"> Other</label>
            </div>
        </div>
        
        <div class="form-group">
            <label for="pharmacyMarket">Are you interested to join the pharmacy market? *</label>
            <select id="pharmacyMarket" name="pharmacyMarket" required>
                <option value="">-- Select an option --</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
                <option value="Maybe">Maybe</option>
            </select>
        </div>
        
        <div class="form-group consent-group">
            <label>
                <input type="checkbox" id="consentGiven" name="consentGiven" required>
                I agree to the terms and consent to data collection
            </label>
        </div>
        
        <button type="submit" id="submitBtn" class="submit-btn">Submit Application</button>
        
        <div id="loadingOverlay" class="loading-overlay hidden">
            <div class="progress-container"><div class="progress-bar"></div></div>
            <p>Your information is going...<br>Please wait.</p>
        </div>
        
        <div id="errorMessage" class="error-message hidden"></div>
    </form>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('registrationForm');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const errorMessage = document.getElementById('errorMessage');
    const submitBtn = document.getElementById('submitBtn');

    // API Endpoint - IMPORTANT: Update this to your Vercel URL once deployed!
    // Example: const API_URL = 'https://your-vercel-app-name.vercel.app/api/submissions';
    const API_URL = 'https://backend-tools76.vercel.app/api/submissions'; 
    const REDIRECT_URL = 'https://tools76.odoo.com/thank-you';

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Hide any previous errors
        errorMessage.classList.add('hidden');
        errorMessage.textContent = '';

        // Gather data
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        
        // Handle interests array (multiple checkboxes)
        const interests = [];
        const interestCheckboxes = document.querySelectorAll('input[name="interests"]:checked');
        interestCheckboxes.forEach((checkbox) => {
            interests.push(checkbox.value);
        });
        data.interests = interests;
        
        // Handle boolean consent
        data.consentGiven = formData.get('consentGiven') === 'on';

        // Add UTM info if available in URL
        const urlParams = new URLSearchParams(window.location.search);
        data.utmInfo = {
            source: urlParams.get('utm_source') || 'Direct',
            medium: urlParams.get('utm_medium') || '',
            campaign: urlParams.get('utm_campaign') || ''
        };
        data.source = window.location.hostname;

        // Show loading screen
        loadingOverlay.classList.remove('hidden');
        submitBtn.disabled = true;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            });

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.error || 'Something went wrong. Please try again.');
            }

            // Success - Redirect
            window.location.href = REDIRECT_URL;
            
        } catch (error) {
            // Hide loading, show error
            loadingOverlay.classList.add('hidden');
            submitBtn.disabled = false;
            
            errorMessage.textContent = error.message;
            errorMessage.classList.remove('hidden');
        }
    });
});

</script>
</body>
</html>
